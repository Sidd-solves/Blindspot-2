# Render Blueprint for the iTax build: a separate service from the original BlindSpot site,
# deployed from the `itax` branch. New → Blueprint → pick this repo and branch.
services:
  - type: web
    name: blindspot-pro
    runtime: docker
    plan: free
    branch: itax
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # paste it in Render; never committed
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ADMIN_TOKEN
        generateValue: true
      - key: BRIDGE_TOKEN
        generateValue: true
