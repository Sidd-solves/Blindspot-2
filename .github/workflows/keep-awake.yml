# Render's free plan puts the server to sleep after 15 minutes with no visitors, and the next visitor waits
# on a "Welcome to Render" screen. This pings the health endpoint every 5 minutes so judges never see that.
# (GitHub can delay scheduled runs at busy times; an external monitor such as UptimeRobot is a good second layer.)
name: Keep the live demo awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health (waits through a cold start)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://blindspot-8lr1.onrender.com/api/health || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
